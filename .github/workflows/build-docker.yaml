name: Build and publish Docker image

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - feature
  pull_request:
    branches:
      - main
      - feature
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 3️⃣ Generate unified release tag
      - name: Generate release tag
        id: version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          IFS='.' read -r major minor patch <<< "${latest_tag#v}"
          new_tag="v${major}.${minor}.$((patch + 1))"
          branch="${GITHUB_REF_NAME}"
          safe_branch=$(echo "$branch" | tr '/' '-' | tr -cd '[:alnum:]._-')
          if [ "$safe_branch" != "main" ]; then
            release_tag="${safe_branch}-${new_tag}"
          else
            release_tag="$new_tag"
          fi
          echo "release_tag=$release_tag" >> $GITHUB_ENV
          echo "Unified release tag: $release_tag"

      # 4️⃣ Build with Maven
      - name: Build Maven project
        run: |
          mvn versions:set -DnewVersion=${{ env.release_tag }} -DgenerateBackupPoms=false
          mvn clean install -DskipTests

      # 5️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6️⃣ Login to DockerHub (main only)
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ Build & Push Docker image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile1
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boardgame-fromgit:${{ env.release_tag }}

      # 8️⃣ Tag and Release (main only)
      - name: Tag & Release
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Harshavardhana"
          git config user.email "your-email@example.com"
          git tag -a "${{ env.release_tag }}" -m "Release ${{ env.release_tag }}"
          git push origin "${{ env.release_tag }}"
