name: Build and publish Docker image

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - feature
  pull_request:
    branches:
      - main
      - feature
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup JDK for Maven
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      # 3️⃣ Fetch all tags
      - name: Fetch all tags
        run: git fetch --tags

      # 4️⃣ Generate unified release tag
      - name: Set unified version tag
        id: set-version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          IFS='.' read -r major minor patch <<< "${latest_tag#v}"
          new_tag="v${major}.${minor}.$((patch + 1))"

          branch="${{ github.ref_name }}"
          safe_branch=$(echo "$branch" | tr '/' '-' | tr -cd '[:alnum:]._-')

          if [ "$safe_branch" != "main" ]; then
            release_tag="${safe_branch}-${new_tag}"
          else
            release_tag="$new_tag"
          fi

          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
          echo "✅ Generated unified tag: $release_tag"

      # 5️⃣ Update Maven version
      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=${{ steps.set-version.outputs.release_tag }} -DgenerateBackupPoms=false

      # 6️⃣ Build Maven project
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # 7️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8️⃣ Login to Docker Hub (main only)
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9️⃣ Build & Push Docker image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile1
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boardgame-fromgit:${{ steps.set-version.outputs.release_tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/boardgame-fromgit:cache
          cache-to: type=inline

      # 🔟 Configure Git (main only)
      - name: Configure Git user
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Harshavardhana"
          git config user.email "your-email@example.com"

      # 1️⃣1️⃣ Push Git tag (main only)
      - name: Push Git tag
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "${{ steps.set-version.outputs.release_tag }}" -m "Release ${{ steps.set-version.outputs.release_tag }}"
          git push origin "${{ steps.set-version.outputs.release_tag }}"

      # 1️⃣2️⃣ Create GitHub Release (main only)
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        with:
          tag_name: "${{ steps.set-version.outputs.release_tag }}"
          release_name: "Release ${{ steps.set-version.outputs.release_tag }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
